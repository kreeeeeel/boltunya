SettingsUpdate:
    type: object
    properties:
        voiceReplyMode:
            $ref: ../speech/VoiceReplyMode.yaml#/VoiceReplyMode
        voiceInputEnabled:
            type: boolean
        voiceReplyProbability:
            type: integer
            minimum: 0
            maximum: 100
        voiceRecognitionModel:
            type: string
            maxLength: 80
        voiceSynthesisModel:
            type: string
            maxLength: 80
        voiceSpeechRate:
            type: number
            minimum: 0.5
            maximum: 2
        paused:
            type: boolean
        defaultModel:
            type: string
        globalPrompt:
            type: string
            maxLength: 4000
        replyDelaySeconds:
            type: integer
            minimum: 0
            maximum: 120
        replyIntervalSeconds:
            type: integer
            minimum: 0
            maximum: 120
        showTyping:
            type: boolean
        formatReplies:
            type: boolean
            description: Enable or disable formatting for subsequent AI replies without changing manual plain text.
        replyProcessingMode:
            $ref: ./ReplyProcessingMode.yaml#/ReplyProcessingMode
            description: Apply a reply queue policy without changing other preferences; omission preserves the saved policy.
        closeToTray:
            type: boolean
        launchAtLogin:
            type: boolean
        resumeOnStartup:
            type: boolean
        ignoreAssistantTasks:
            type: boolean
        customStyles:
            type: array
            maxItems: 30
            items:
                $ref: ./WritingStyle.yaml#/WritingStyle
        groupReplies:
            $ref: ./GroupRepliesMode.yaml#/GroupRepliesMode
        memoryEnabled:
            type: boolean
        memoryIntervalHours:
            type: integer
            minimum: 1
            maximum: 168
        autoDownloadPhotos:
            type: boolean
        autoDownloadVideos:
            type: boolean
        autoDownloadAudio:
            type: boolean
        autoDownloadFiles:
            type: boolean
        autoDownloadMaxMb:
            type: integer
            minimum: 1
            maximum: 100
        ollamaDevice:
            type: string
            maxLength: 80
            description: auto, cpu, or a supported discovered NVIDIA UUID. Saves a preference without stopping any process.
        defaultModelProfileId:
            type: string
            maxLength: 36
        deliveryMode:
            $ref: ./GlobalDeliveryMode.yaml#/GlobalDeliveryMode
        maxParallelTasks:
            type: integer
            minimum: 1
            maximum: 4
        memoryCollectionScope:
            $ref: ../memory/MemoryCollectionScope.yaml#/MemoryCollectionScope
        proactiveEnabled:
            type: boolean
            description: 'Default: false.'
        proactiveIntervalMinutes:
            type: integer
            minimum: 5
            maximum: 43200
            description: 'Default: 60.'
