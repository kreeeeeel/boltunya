Settings:
    type: object
    required:
        - paused
        - defaultModel
        - rules
        - defaultModelProfileId
        - deliveryMode
    properties:
        paused:
            type: boolean
        defaultModel:
            type: string
        rules:
            type: object
            additionalProperties:
                $ref: ../chats/ChatRule.yaml#/ChatRule
        globalPrompt:
            type: string
            maxLength: 4000
        replyDelaySeconds:
            type: integer
            minimum: 0
            maximum: 120
            default: 3
        replyIntervalSeconds:
            type: integer
            minimum: 0
            maximum: 120
            default: 3
        showTyping:
            type: boolean
            default: true
        closeToTray:
            type: boolean
            default: true
        launchAtLogin:
            type: boolean
            default: false
        resumeOnStartup:
            type: boolean
            default: false
        ignoreAssistantTasks:
            type: boolean
        customStyles:
            type: array
            maxItems: 30
            items:
                $ref: ./WritingStyle.yaml#/WritingStyle
        groupReplies:
            $ref: ./GroupRepliesMode.yaml#/GroupRepliesMode
        memoryEnabled:
            type: boolean
            default: true
        memoryIntervalHours:
            type: integer
            minimum: 1
            maximum: 168
            default: 6
        autoDownloadPhotos:
            type: boolean
        autoDownloadVideos:
            type: boolean
        autoDownloadAudio:
            type: boolean
        autoDownloadFiles:
            type: boolean
        autoDownloadMaxMb:
            type: integer
            minimum: 1
            maximum: 100
        ollamaDevice:
            type: string
            default: auto
            maxLength: 80
            description: >-
                auto, cpu, or a supported NVIDIA UUID discovered by the application. Applied only on the next
                app-managed Ollama launch.
        defaultModelProfileId:
            type: string
            default: ''
            maxLength: 36
        deliveryMode:
            $ref: ./DefaultDeliveryMode.yaml#/DefaultDeliveryMode
        maxParallelTasks:
            type: integer
            minimum: 1
            maximum: 4
            default: 1
        memoryCollectionScope:
            $ref: ../memory/MemoryCollectionScope.yaml#/MemoryCollectionScope
        proactiveEnabled:
            type: boolean
            description: 'Default: false.'
        proactiveIntervalMinutes:
            type: integer
            minimum: 5
            maximum: 43200
            description: 'Default: 60.'
