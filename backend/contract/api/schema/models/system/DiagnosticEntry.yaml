DiagnosticEntry:
    type: object
    required:
        - id
        - date
        - firstOccurredAt
        - source
        - code
        - message
        - remediation
        - exceptionType
        - occurrences
        - metadata
    properties:
        id:
            type: string
        date:
            type: integer
            format: int64
        firstOccurredAt:
            type: integer
            format: int64
        source:
            $ref: ./DiagnosticSource.yaml#/DiagnosticSource
        code:
            type: string
        message:
            type: string
        remediation:
            type: string
        exceptionType:
            type: string
        occurrences:
            type: integer
            minimum: 1
        metadata:
            type: object
            additionalProperties:
                type: string
