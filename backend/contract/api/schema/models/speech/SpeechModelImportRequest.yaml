SpeechModelImportRequest:
    type: object
    required: [uploadId, title]
    properties:
        uploadId:
            type: string
            minLength: 36
            maxLength: 36
        title:
            type: string
            minLength: 1
            maxLength: 80
        language:
            type: string
            maxLength: 10
        license:
            type: string
            maxLength: 512
