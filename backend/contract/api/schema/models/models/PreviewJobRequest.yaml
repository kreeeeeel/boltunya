PreviewJobRequest:
    type: object
    required:
        - chatId
    properties:
        chatId:
            type: string
            minLength: 1
        rule:
            $ref: ../chats/ChatRuleInput.yaml#/ChatRuleInput
        text:
            type: string
            description: Legacy compatibility; real chat history is used for draft generation.
        messageId:
            type: string
            description: >-
                Optional incoming message ID. History is limited through this real message; no synthetic message is
                appended.
