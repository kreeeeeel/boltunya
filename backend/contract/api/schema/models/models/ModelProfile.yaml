ModelProfile:
    type: object
    required:
        - id
        - name
        - provider
        - preset
        - baseUrl
        - model
        - enabled
        - options
        - capabilities
        - apiKeyConfigured
    properties:
        id:
            type: string
            format: uuid
        name:
            type: string
            minLength: 1
            maxLength: 80
        provider:
            $ref: ./ModelProvider.yaml#/ModelProvider
        preset:
            $ref: ./ModelPreset.yaml#/ModelPreset
        baseUrl:
            type: string
            minLength: 1
            maxLength: 500
        model:
            type: string
            minLength: 1
            maxLength: 160
        enabled:
            type: boolean
            default: true
        options:
            $ref: ./ModelProfileOptions.yaml#/ModelProfileOptions
        capabilities:
            $ref: ./ModelCapabilities.yaml#/ModelCapabilities
        apiKeyConfigured:
            type: boolean
            default: false
