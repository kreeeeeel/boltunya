Reply:
    type: object
    required:
        - text
        - durationMs
        - tokensPerSecond
    properties:
        text:
            type: string
        durationMs:
            type: integer
            format: int64
        tokensPerSecond:
            type: number
        model:
            type: string
            default: ''
        stickerId:
            type: string
            default: ''
        entities:
            type: array
            maxItems: 100
            default: []
            items:
                $ref: ../chats/MessageEntity.yaml#/MessageEntity
            description: Formatting of the final plain text, using UTF-16 offsets and lengths.
