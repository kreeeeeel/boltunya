ModelProfileUpdate:
    type: object
    required:
        - name
        - provider
        - baseUrl
        - model
    properties:
        name:
            type: string
            minLength: 1
            maxLength: 80
        provider:
            $ref: ./ModelProvider.yaml#/ModelProvider
        preset:
            $ref: ./ModelPreset.yaml#/ModelPreset
        baseUrl:
            type: string
            minLength: 1
            maxLength: 500
        model:
            type: string
            minLength: 1
            maxLength: 160
        enabled:
            type: boolean
            default: true
        options:
            allOf:
                -
                    $ref: ./ModelProfileOptionsInput.yaml#/ModelProfileOptionsInput
            default: {}
            x-kotlin-empty-default: true
        capabilities:
            allOf:
                -
                    $ref: ./ModelCapabilitiesInput.yaml#/ModelCapabilitiesInput
            default: {}
            x-kotlin-empty-default: true
        apiKey:
            type: string
            nullable: true
            maxLength: 8192
            writeOnly: true
            description: Omitted or empty keeps the existing key. Never returned.
        clearApiKey:
            type: boolean
            default: false
