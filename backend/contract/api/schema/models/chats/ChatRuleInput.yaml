ChatRuleInput:
    type: object
    properties:
        enabled:
            type: boolean
            default: false
        replyInterruptionMode:
            $ref: ./ReplyInterruptionMode.yaml#/ReplyInterruptionMode
        style:
            $ref: ./CommunicationStyle.yaml#/CommunicationStyle
        model:
            type: string
            default: qwen3:1.7b
        instructions:
            type: string
            default: ''
        contextMessages:
            type: integer
            default: 20
        maxTokens:
            type: integer
            default: 128
        delaySeconds:
            type: integer
            default: 0
        proactiveMessageMode:
            $ref: ./ProactiveMessageMode.yaml#/ProactiveMessageMode
        proactiveText:
            type: string
            maxLength: 4096
            default: ''
        creativity:
            type: integer
            default: 60
        emoji:
            type: boolean
            default: true
        internetAccess:
            type: boolean
            default: true
        matchMyStyle:
            type: boolean
            default: true
        styleId:
            type: string
            maxLength: 64
            default: ''
        groupReplies:
            $ref: ./ChatGroupReplies.yaml#/ChatGroupReplies
        useMemory:
            type: boolean
            default: true
        sourceLinks:
            $ref: ./SourceLinksMode.yaml#/SourceLinksMode
        useDefaultModel:
            type: boolean
            default: true
            description: Follow the global model selection unless explicitly overridden.
        modelProfileId:
            type: string
            default: ''
            maxLength: 36
        deliveryMode:
            $ref: ../common/DeliveryMode.yaml#/DeliveryMode
        analyzePhotos:
            type: boolean
            default: false
        aiStickers:
            type: boolean
            default: false
        proactiveMode:
            $ref: ../settings/ProactiveMode.yaml#/ProactiveMode
        proactiveIntervalMinutes:
            type: integer
            minimum: 0
            maximum: 43200
            description: 'Default: 0.'
            default: 0
