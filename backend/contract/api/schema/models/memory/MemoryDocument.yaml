MemoryDocument:
    type: object
    required:
        - chatId
        - notes
        - summary
        - revision
        - updatedAt
        - processedMessages
        - backfillComplete
        - status
        - error
        - trackedChats
        - relativePath
    properties:
        chatId:
            type: string
        notes:
            type: string
        summary:
            type: string
        revision:
            type: string
        updatedAt:
            type: integer
            format: int64
        processedMessages:
            type: integer
            format: int64
        backfillComplete:
            type: boolean
        status:
            $ref: ./MemoryCollectionStatus.yaml#/MemoryCollectionStatus
        error:
            type: string
        trackedChats:
            type: integer
        relativePath:
            type: string
        collection:
            $ref: ./MemoryCollectionProgress.yaml#/MemoryCollectionProgress
