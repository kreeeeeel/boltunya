SendMediaRequest:
    type: object
    required:
        - uploadIds
        - kind
    properties:
        uploadIds:
            type: array
            items:
                type: string
                format: uuid
            minItems: 1
            maxItems: 10
        kind:
            $ref: ./OutgoingMediaKind.yaml#/OutgoingMediaKind
        caption:
            type: string
            maxLength: 1024
            default: ''
        captionEntities:
            type: array
            maxItems: 100
            default: []
            items:
                $ref: ../chats/MessageEntity.yaml#/MessageEntity
            description: Formatting of the first media caption, using UTF-16 offsets and lengths.
