StickerCatalog:
    type: object
    required:
        - recent
        - favorites
        - sets
    properties:
        recent:
            type: array
            items:
                $ref: ./StickerItem.yaml#/StickerItem
        favorites:
            type: array
            items:
                $ref: ./StickerItem.yaml#/StickerItem
        sets:
            type: array
            items:
                $ref: ./StickerSet.yaml#/StickerSet
