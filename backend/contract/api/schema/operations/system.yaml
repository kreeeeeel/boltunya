state:
    get:
        operationId: state
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/system/State.yaml#/State
            '400':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '502':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
        tags:
            - system
quit:
    post:
        operationId: quit
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '400':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '502':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
        tags:
            - system
metrics:
    get:
        operationId: getMetrics
        tags:
            - system
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: ../models/system/MetricSample.yaml#/MetricSample
            '400':
                description: Invalid request
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Authentication required
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
cache:
    get:
        operationId: getCacheStatistics
        tags:
            - system
        security:
            -
                sessionCookie: []
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/system/CacheStatistics.yaml#/CacheStatistics
cacheClear:
    post:
        operationId: clearMediaCache
        tags:
            - system
        security:
            -
                sessionCookie: []
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/system/CacheStatistics.yaml#/CacheStatistics
diagnosticsErrors:
    get:
        operationId: diagnosticErrors
        tags:
            - system
        description: >-
            A bounded support log containing only error codes, static explanations and allowlisted technical metadata.
            No exception messages, chat content, account IDs, credentials or prompts are persisted.
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/system/DiagnosticReport.yaml#/DiagnosticReport
            '401':
                description: Local session required
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
    delete:
        operationId: clearDiagnosticErrors
        tags:
            - system
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '401':
                description: Local session required
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
storageLocations:
    get:
        operationId: storageLocations
        tags:
            - system
        description: >-
            Known profile and local Ollama directories. Unknown Docker, service-user and remote model paths are reported
            as external. Electron accepts a location ID and rechecks this allowlist before opening a folder.
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/system/StorageLocationReport.yaml#/StorageLocationReport
            '401':
                description: Local session required
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
