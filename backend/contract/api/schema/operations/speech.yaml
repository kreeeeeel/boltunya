            '400':
                description: Invalid request
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Local authentication required
            '409':
                description: Speech model unavailable or Telegram account changed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
