                    type: string
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: ../models/memory/MemoryRefreshRequest.yaml#/MemoryRefreshRequest
        responses:
            '200':
                description: Success
                content:
                    application/json:
