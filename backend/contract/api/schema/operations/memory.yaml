memory:
    get:
        tags:
            - memory
        security:
            -
                sessionCookie: []
        operationId: getGlobalMemory
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/memory/MemoryDocument.yaml#/MemoryDocument
            '400':
                description: Invalid input
            '401':
                description: Unauthorized
            '403':
                description: Forbidden
            '409':
                description: Memory was edited concurrently
    patch:
        tags:
            - memory
        security:
            -
                sessionCookie: []
        operationId: updateGlobalMemory
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: ../models/memory/MemoryNotesUpdate.yaml#/MemoryNotesUpdate
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/memory/MemoryDocument.yaml#/MemoryDocument
            '400':
                description: Invalid input
            '401':
                description: Unauthorized
            '403':
                description: Forbidden
            '409':
                description: Memory was edited concurrently
memoryRefresh:
    post:
        tags:
            - memory
        security:
            -
                sessionCookie: []
        operationId: refreshChangedMemory
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '400':
                description: Invalid input
            '401':
                description: Unauthorized
            '403':
                description: Forbidden
            '409':
                description: Memory was edited concurrently
        requestBody:
            required: false
            content:
                application/json:
                    schema:
                        $ref: ../models/memory/MemoryRefreshRequest.yaml#/MemoryRefreshRequest
memoryByChatId:
