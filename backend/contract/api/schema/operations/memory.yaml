            '400':
                description: Invalid input
            '401':
                description: Unauthorized
            '403':
                description: Forbidden
            '409':
                description: Memory was edited concurrently
    patch:
        tags:
            - memory
        security:
            -
                sessionCookie: []
        operationId: updateChatMemory
        parameters:
            -
                name: chatId
                in: path
                required: true
                schema:
                    type: string
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: ../models/memory/MemoryNotesUpdate.yaml#/MemoryNotesUpdate
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/memory/MemoryDocument.yaml#/MemoryDocument
            '400':
                description: Invalid input
            '401':
                description: Unauthorized
            '403':
                description: Forbidden
            '409':
                description: Memory was edited concurrently
    post:
