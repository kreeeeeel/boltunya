memoryCancel:
    post:
        operationId: cancelGlobalMemoryCollection
        responses:
            '200':
                description: Collection cancelled; saved memory is preserved
                content:
                    application/json:
                        schema:
                            $ref: ../models/memory/MemoryDocument.yaml#/MemoryDocument
        tags:
            - memory
memoryByChatIdCancel:
    post:
        operationId: cancelChatMemoryCollection
        parameters:
            -
                name: chatId
                in: path
                required: true
                schema:
                    type: string
        responses:
            '200':
