chatsByChatIdMessages:
    get:
        operationId: history
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: ../models/chats/Message.yaml#/Message
            '400':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '502':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
        parameters:
            -
                in: path
                name: chatId
                required: true
                schema:
                    type: string
            -
                in: query
                name: before
                required: false
                schema:
                    type: string
        tags:
            - chats
    post:
        operationId: send
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '400':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '502':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: ../models/chats/Text.yaml#/Text
        parameters:
            -
                in: path
                name: chatId
                required: true
                schema:
                    type: string
        tags:
            - chats
