telegramConnect:
    post:
        operationId: connect
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '400':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '502':
                description: Request failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: ../models/telegram/Credentials.yaml#/Credentials
        tags:
            - telegram
