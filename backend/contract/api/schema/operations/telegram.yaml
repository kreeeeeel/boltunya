    post:
        operationId: restoreTelegramSession
        responses:
            '200':
                description: Restoring saved Telegram session
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '502':
                description: Session restore failed
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
        tags:
            - telegram
