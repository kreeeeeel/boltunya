activityByIdFeedback:
    put:
        operationId: saveActivityFeedback
        tags:
            - activity
        description: >-
            Store explicit local human feedback for a completed event with a ready response. This does not train the
            model or alter memory. Omitted comments retain the previous comment.
        parameters:
            -
                name: id
                in: path
                required: true
                schema:
                    type: string
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: ../models/activity/ActivityFeedbackUpdate.yaml#/ActivityFeedbackUpdate
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/activity/ActivityFeedback.yaml#/ActivityFeedback
            '400':
                description: Invalid rating or comment
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '401':
                description: Local session required
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '404':
                description: Activity event not found
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '409':
                description: The event is not final or has no ready response
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
    delete:
        operationId: removeActivityFeedback
        tags:
            - activity
        description: Remove local human feedback. Repeated deletion on an eligible event is successful.
        parameters:
            -
                name: id
                in: path
                required: true
                schema:
                    type: string
        responses:
            '200':
                description: Success
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '401':
                description: Local session required
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '404':
                description: Activity event not found
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '409':
                description: The event is not final or has no ready response
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
