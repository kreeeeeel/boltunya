engineRestart:
    post:
        operationId: restartEngine
        description: Restart the app-managed local Ollama process. External servers are never stopped.
        tags:
            - models
        responses:
            '200':
                description: Ollama process restarted
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Ok.yaml#/Ok
            '401':
                description: Local session required
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '409':
                description: Ollama is not managed by the application
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
            '502':
                description: Ollama could not be restarted
                content:
                    application/json:
                        schema:
                            $ref: ../models/common/Error.yaml#/Error
