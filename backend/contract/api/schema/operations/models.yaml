engineDevices:
    get:
        operationId: engineDevices
        tags:
            - models
        description: >-
            Discover safe GPU choices and indicate whether the running Ollama is app-managed. Does not stop, restart or
            change external Ollama, Docker, drivers or models.
        responses:
            '200':
                description: Device choices and launch capabilities
                content:
                    application/json:
                        schema:
                            $ref: ../models/models/ComputeDeviceStatus.yaml#/ComputeDeviceStatus
            '401':
