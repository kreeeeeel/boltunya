  "components": {
    "schemas": {
      "ChatRule": {
        "type": "object",
        "required": [
          "enabled",
          "style",
          "model",
          "instructions",
          "contextMessages",
          "maxTokens",
          "delaySeconds",
          "creativity",
          "emoji"
        ],
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "style": {
            "type": "string",
            "enum": [
              "friendly",
              "business",
              "concise",
              "warm",
              "aggressive",
              "rough",
              "custom"
            ]
          },
          "model": {
            "type": "string"
          },
          "instructions": {
            "type": "string"
          },
          "contextMessages": {
            "type": "integer"
          },
          "maxTokens": {
            "type": "integer"
          },
          "delaySeconds": {
            "type": "integer"
          },
          "creativity": {
            "type": "integer"
          },
          "emoji": {
            "type": "boolean"
          },
          "internetAccess": {
            "type": "boolean",
            "default": true
          },
          "matchMyStyle": {
            "type": "boolean",
            "default": true
          },
          "styleId": {
            "type": "string",
            "maxLength": 64
          },
          "groupReplies": {
            "type": "string",
            "enum": [
              "inherit",
              "disabled",
              "mentions",
              "all"
            ]
          },
          "useMemory": {
            "type": "boolean",
            "default": true
          },
          "sourceLinks": {
            "type": "string",
            "enum": [
              "requested",
              "always",
              "never"
            ],
            "default": "requested"
          },
          "useDefaultModel": {
            "type": "boolean",
            "default": true,
            "description": "Follow the global model selection unless explicitly overridden."
          }
        }
      },
      "Settings": {
        "type": "object",
        "required": [
          "paused",
          "defaultModel",
          "rules"
        ],
        "properties": {
          "paused": {
            "type": "boolean"
          },
          "defaultModel": {
            "type": "string"
          },
          "rules": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/ChatRule"
            }
          },
          "globalPrompt": {
            "type": "string",
            "maxLength": 4000
          },
          "replyDelaySeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 120,
            "default": 3
          },
          "replyIntervalSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 120,
            "default": 3
          },
          "showTyping": {
            "type": "boolean",
            "default": true
          },
          "closeToTray": {
            "type": "boolean",
            "default": true
          },
          "launchAtLogin": {
            "type": "boolean",
            "default": false
          },
          "resumeOnStartup": {
            "type": "boolean",
            "default": false
          },
          "ignoreAssistantTasks": {
            "type": "boolean"
          },
          "customStyles": {
            "type": "array",
            "maxItems": 30,
            "items": {
              "$ref": "#/components/schemas/WritingStyle"
            }
          },
          "groupReplies": {
            "type": "string",
            "enum": [
              "disabled",
              "mentions",
              "all"
            ]
          },
          "memoryEnabled": {
            "type": "boolean",
            "default": true
          },
          "memoryIntervalHours": {
            "type": "integer",
            "minimum": 1,
            "maximum": 168,
            "default": 6
          },
          "autoDownloadPhotos": {
            "type": "boolean"
          },
          "autoDownloadVideos": {
            "type": "boolean"
          },
          "autoDownloadAudio": {
            "type": "boolean"
          },
          "autoDownloadFiles": {
            "type": "boolean"
          },
          "autoDownloadMaxMb": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          }
        }
      },
      "Chat": {
        "type": "object",
        "required": [
          "id",
          "title",
          "preview",
          "date",
          "unread",
          "rule"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "preview": {
            "type": "string"
          },
          "date": {
            "type": "integer"
