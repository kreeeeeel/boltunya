name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      JAVA_TOOL_OPTIONS: -Djdk.net.unixdomain.tmpdir=C:/boltunya-no-unix-sockets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $package=Get-Content -Raw desktop/package.json | ConvertFrom-Json
          $parts=$package.version.Split('.')
          $version="$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies and Chromium
        shell: pwsh
        run: |
          npm ci --prefix web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec --prefix web -- playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and build portable executable
        shell: pwsh
        run: ./scripts/build.ps1 -Version '${{ steps.version.outputs.value }}' -SkipShortcut
      - name: Test browser interface
        shell: pwsh
        run: ./scripts/test-web.ps1
      - name: Test native Electron window and tray
        shell: pwsh
        run: |
          npm run test:smoke --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:updater --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:media --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aigram-Windows
          path: |
            complie/Aigram.exe
            complie/SHA256.txt
            scripts/diagnose-ai.ps1
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version='${{ steps.version.outputs.value }}'
          $releaseDirectory='build/release'
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          Copy-Item -LiteralPath 'complie/Aigram.exe' -Destination "$releaseDirectory/Aigram.exe"
          Copy-Item -LiteralPath "$releaseDirectory/Aigram.exe" -Destination "$releaseDirectory/Boltunya.exe"
          Copy-Item -LiteralPath 'scripts/diagnose-ai.ps1' -Destination "$releaseDirectory/Diagnose-AI.ps1"
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath "$releaseDirectory/Aigram.exe").Hash.ToLowerInvariant()
          @("$hash  Aigram.exe", "$hash  Boltunya.exe") | Set-Content -Encoding utf8 "$releaseDirectory/SHA256.txt"
          $changelog=Get-Content -Raw -LiteralPath 'CHANGELOG.md'
          $entryStart=$changelog.IndexOf('## ', [StringComparison]::Ordinal)
          if ($entryStart -lt 0) { throw 'CHANGELOG.md has no release entry' }
          $nextEntry=$changelog.IndexOf("`n## ", $entryStart + 3, [StringComparison]::Ordinal)
          $entry=if ($nextEntry -lt 0) { $changelog.Substring($entryStart) } else { $changelog.Substring($entryStart, $nextEntry - $entryStart) }
          if (-not $entry.Contains('### Changed') -and -not $entry.Contains('### Fixed') -and -not $entry.Contains('### Added') -and -not $entry.Contains('### Removed')) { throw 'Release entry must describe actual changes' }
          $checks="`n`n### Release checks`n`nKotlin, frontend and Electron checks, browser scenarios, native window/tray, updater and media smoke tests passed before publication. Built with JDK 21. Source: $env:GITHUB_SHA. [Verification run](https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID). Download SHA256.txt to verify Aigram.exe; Boltunya.exe is the identical compatibility download.`n"
          $notesPath=Join-Path $releaseDirectory 'notes.md'
          Set-Content -Encoding utf8 -LiteralPath $notesPath -Value ($entry.Trim() + $checks)
          gh release create "v$version" "$releaseDirectory/Aigram.exe" "$releaseDirectory/Boltunya.exe" "$releaseDirectory/SHA256.txt" "$releaseDirectory/Diagnose-AI.ps1" --target "$env:GITHUB_SHA" --title "Aigram $version" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release=gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$version" | ConvertFrom-Json
          $exe=$release.assets | Where-Object name -eq 'Aigram.exe'
          $compatibilityExe=$release.assets | Where-Object name -eq 'Boltunya.exe'
          $checksum=$release.assets | Where-Object name -eq 'SHA256.txt'
          if($release.draft -or -not $exe -or $exe.size -lt 50000000 -or -not $compatibilityExe -or $compatibilityExe.size -ne $exe.size -or -not $checksum) { throw 'Published release assets are incomplete.' }
          "### [Aigram $version]($($release.html_url))" >> $env:GITHUB_STEP_SUMMARY
          'Portable Windows executable and SHA-256 checksum published successfully.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Build-diagnostics
          path: |
            backend/build/reports/
            web/test-results/
            build/reports/
          retention-days: 7
